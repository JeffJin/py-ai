name: xcs-torch
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - cmake=3.31.2
  - boost=1.82.0
  # --- BLAS: use OpenBLAS instead of MKL to avoid omp_get_num_procs symbol conflict on Linux ---
  - nomkl
  - libblas=*=*openblas
  # --- notebooks / kernels ---
  - notebook=7.3.2
  - jupyterlab>=4        # required by notebook>=7; prevents old v3 being pulled in by jupyter=1.1.1
  - jupyter_server>=2   # required by notebook>=7 and jupyterlab>=4
  - jupyter=1.1.1
  - ipykernel=6.29.5    # fixed: 7.x is macOS/Windows only; latest Linux stable is 6.x
  - tk>=8.6             # loosened: =8.6.14 conflicts on Linux; let conda pick compatible build
  # --- scientific stack ---
  - numpy>=2.0,<3.0
  - pandas=2.2.3
  - scipy=1.17.1
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - plotly=6.0.0
  - pillow=12.1.1
  - requests=2.34.2
  - graphviz
  - python-graphviz
  # --- pytorch ---
  # Official PyTorch releases after 2.5 are distributed as pip wheels.
  # CUDA 12.8 supports the RTX 3090 Ti (Ampere) with a sufficiently new driver.
  # --- RL / misc ---
  - gymnasium=1.0.0
  - jax-jumpy=1.0.0
  - pygame=2.6.1
  - keyboard=0.13.5
  - cloudpickle=3.1.1
  # --- support libs (pinned to keep the solve reproducible) ---
  - cycler=0.12.1
  - importlib-metadata=8.6.1
  - kiwisolver=1.4.8
  - packaging=24.2
  - pyparsing=3.2.1
  - python-dateutil=2.9.0.post0
  - six=1.17.0
  - typing_extensions>=4.12.2  # loosened: =4.12.2 conflicts with ipykernel 6.x deps
  - zipp=3.21.0
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - torchaudio==2.11.0+cu128
      - osmium==4.0.2  # PyPI distribution of pyosmium; not packaged as "osmium" on conda-forge

# Notes:
# - Merged from the former environment.yml (py-ai-pytorch) and environment-xcs.yml (xcs-torch)
#   into this single source of truth. The active env / PyCharm interpreter is `xcs-torch`.
# - PyTorch is installed from its CUDA 12.8 pip wheel index; Conda manages the environment.
#   Python remains pinned to 3.11 for broad package compatibility.
# - Create:  conda env create -f environment.yml
# - Update:  conda env update -f environment.yml -n xcs-torch --prune
