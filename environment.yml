name: py-ai-pytorch
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - numpy>=1.21.6,<2.0
  - matplotlib>=3.9
  - pandas>=2.2
  - seaborn>=0.13
  - scikit-learn>=1.5
  - scipy>=1.11
  - pillow>=10.0
  - requests>=2.32
  - jupyter>=1.1
  - ipykernel>=6.29
  - pytorch=2.2
  - torchvision=0.15.2
  - torchaudio=2.2
  - pytorch-cuda=11.8
  - pip

# Notes:
# - This YAML merges the PyTorch and py-ai environments
# - Uses the `pytorch` and `nvidia` channels so the binary build is compatible
#   with CUDA 11.8 (pytorch-cuda=11.8). It pins Python to 3.11 to avoid the torchvision
#   / python compatibility problems you saw when using Python 3.12.
# - To create the environment: `conda env create -f environment.yml` (run from this folder).
# - To update an existing env from this file: `conda env update -f environment.yml -n py-ai-pytorch`.