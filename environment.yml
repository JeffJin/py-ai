name: xcs-torch
channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - cmake=3.31.2
  - boost=1.82.0
  # --- notebooks / kernels ---
  - notebook=7.3.2
  - jupyter=1.1.1
  - ipykernel=7.3.0
  - tk=8.6.14
  # --- scientific stack ---
  - numpy>=1.24,<2.0  # Fixed to protect PyTorch 2.2 C-API mappings
  - pandas=2.2.3
  - scipy=1.17.1
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - plotly=6.0.0
  - pillow=12.1.1
  - requests=2.34.2
  # --- pytorch (CUDA 11.8 build) ---
  - pytorch=2.2.2
  - torchvision=0.17.2  # 0.15.2 was built for PyTorch 2.0 and fails under 2.2 (undefined symbol)
  - torchaudio=2.2.2
  - pytorch-cuda=11.8
  # --- RL / misc ---
  - gymnasium=1.0.0
  - jax-jumpy=1.0.0
  - pygame=2.6.1
  - keyboard=0.13.5
  - cloudpickle=3.1.1
  # --- support libs (pinned to keep the solve reproducible) ---
  - cycler=0.12.1
  - importlib-metadata=8.6.1
  - kiwisolver=1.4.8
  - packaging=24.2
  - pyparsing=3.2.1
  - python-dateutil=2.9.0.post0
  - six=1.17.0
  - typing_extensions=4.12.2
  - zipp=3.21.0
  - pip
  - pip:
      - osmium==4.0.2  # PyPI distribution of pyosmium; not packaged as "osmium" on conda-forge

# Notes:
# - Merged from the former environment.yml (py-ai-pytorch) and environment-xcs.yml (xcs-torch)
#   into this single source of truth. The active env / PyCharm interpreter is `xcs-torch`.
# - Uses the `pytorch` and `nvidia` channels so the binary build is compatible with CUDA 11.8.
#   Python is pinned to 3.11 to avoid the torchvision / Python 3.12 compatibility problems.
# - Create:  conda env create -f environment.yml
# - Update:  conda env update -f environment.yml -n xcs-torch --prune
