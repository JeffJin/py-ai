name: mac-torch
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - cmake=3.31.2
  - boost=1.82.0
  # --- BLAS: use OpenBLAS instead of MKL to avoid omp_get_num_procs symbol conflict ---
  - nomkl
  - libblas=*=*openblas
  # --- notebooks / kernels ---
  - notebook=7.3.2
  - jupyterlab>=4        # required by notebook>=7; prevents old v3 being pulled in by jupyter=1.1.1
  - jupyter_server>=2   # required by notebook>=7 and jupyterlab>=4
  - jupyter=1.1.1
  - ipykernel               # unpinned: let conda pick a macOS-compatible build
  - tk>=8.6
  # --- scientific stack ---
  - numpy>=2.0,<3.0
  - pandas=2.2.3
  - scipy=1.17.1
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - plotly=6.0.0
  - pillow=12.1.1
  - requests=2.34.2
  - regex
  - tiktoken
  - graphviz
  - python-graphviz
  # --- pytorch ---
  # macOS has no CUDA support; PyTorch here uses CPU / Apple Silicon MPS backend instead.
  # --- RL / misc ---
  - gymnasium=1.0.0
  - jax-jumpy=1.0.0
  - pygame=2.6.1
  - cloudpickle=3.1.1
  # --- support libs (pinned to keep the solve reproducible) ---
  - cycler=0.12.1
  - importlib-metadata=8.6.1
  - kiwisolver=1.4.8
  - packaging=24.2
  - pyparsing=3.2.1
  - python-dateutil=2.9.0.post0
  - six=1.17.0
  - typing_extensions>=4.12.2
  - zipp=3.21.0
  - pip
  - pip:
      - torch==2.11.0
      - torchvision==0.26.0
      - torchaudio==2.11.0
      - osmium==4.0.2  # PyPI distribution of pyosmium; not packaged as "osmium" on conda-forge
      - keyboard==0.13.5  # not available via conda channels on any platform; pip-only

# Notes:
# - macOS variant of environment.yml (the Ubuntu/RTX-3090-Ti source of truth).
# - Removed the `nvidia` conda channel (irrelevant without CUDA on macOS).
# - Removed the CUDA 12.8 (`+cu128`) pip wheel index; installs plain PyTorch wheels
#   which support CPU and Apple Silicon MPS acceleration.
# - `ipykernel` is unpinned in both yml files; conda resolves a compatible build per platform.
# - Moved `keyboard` into the pip section — it is never available via conda channels
#   (see PackagesNotFoundError), regardless of OS. Note: on macOS the `keyboard`
#   package requires Accessibility/root permissions to capture global key events.
# - Create:  conda env create -f environment-mac.yml
# - Update:  conda env update -f environment-mac.yml -n xcs-torch --prune
